name: Continuous Integration

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read .tool-versions
        id: tool-versions
        uses: endorama/asdf-parse-tool-versions@v1.3.4

      - name: Install shfmt
        run: |
          version="v${{ env.SHFMT_VERSION }}"
          wget https://github.com/mvdan/sh/releases/download/${version}/shfmt_${version}_linux_amd64
          chmod +x shfmt_${version}_linux_amd64
          sudo mv shfmt_${version}_linux_amd64 /usr/local/bin/shfmt

      - name: Run shfmt
        run: |
          shfmt -d ./trento-support.sh

      - name: Check formatting
        run: shfmt -d ./trento-support.sh

      - name: Setup shellcheck
        uses: reviewdog/action-shellcheck@v1.31.0

      - name: Check for shellcheck
        run: |
          shellcheck -s bash ./trento-support.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read .tool-versions
        id: tool-versions
        uses: endorama/asdf-parse-tool-versions@v1.3.4

      - name: Setup BATS
        uses: mig4/setup-bats@v1
        with:
          bats-version: ${{ env.BATS_VERSION }}

      - name: Run tests
        run: |
          bats -r ./test
