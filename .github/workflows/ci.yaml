name: Continuous Integration

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "VERSION"
      - "CHANGELOG.md"
  pull_request:
    paths-ignore:
      - "VERSION"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Read .tool-versions
        id: tool-versions
        uses: endorama/asdf-parse-tool-versions@afbfa92e56234f29b1e82314f50c3d1244285f60 # v1.3.4

      - name: Install shfmt
        run: |
          version="v${{ env.SHFMT_VERSION }}"
          wget https://github.com/mvdan/sh/releases/download/${version}/shfmt_${version}_linux_amd64
          chmod +x shfmt_${version}_linux_amd64
          sudo mv shfmt_${version}_linux_amd64 /usr/local/bin/shfmt

      - name: Check formatting
        run: make fmt-check

      - name: Install ShellCheck
        run: |
          set -e
          version="${{ env.SHELLCHECK_VERSION }}"
          ARCH=$(uname -m)
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          wget -qO shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.${OS}.${ARCH}.tar.xz
          tar -xf shellcheck.tar.xz
          sudo mv shellcheck-v${version} /usr/local/share/shellcheck
          sudo ln -sf /usr/local/share/shellcheck/shellcheck /usr/local/bin/shellcheck

      - name: Check for lint issues
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Read .tool-versions
        id: tool-versions
        uses: endorama/asdf-parse-tool-versions@afbfa92e56234f29b1e82314f50c3d1244285f60 # v1.3.4

      - name: Setup BATS
        uses: mig4/setup-bats@af9a00deb21b5d795cabfeaa8d9060410377686d # v1
        with:
          bats-version: ${{ env.BATS_VERSION }}

      - name: Run tests
        run: |
          bats -r ./test

  obs-sync:
    name: OBS sync
    if: fromJSON(vars.OBS_ENABLED) && github.event_name == 'push'
    uses: trento-project/.github/.github/workflows/obs-sync.yaml@406be0972195864a87ed454458eaa0856d0c5457 # v1.6.0
    needs:
      - static-analysis
      - test
    with:
      obs_project: ${{ vars.OBS_PROJECT_ROLLING }}
      obs_package: ${{ vars.OBS_PACKAGE }}
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
      obs_user: ${{ secrets.OBS_USER }}
      obs_pass: ${{ secrets.OBS_PASS }}
      obs_ssh_key: ${{ secrets.OBS_SSH_KEY }}
